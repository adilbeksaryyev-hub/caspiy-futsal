<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Жаңалықтар — CASPIY Futsal Club</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', Arial, sans-serif;
      background: #020a10;
      color: #f4fbff;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 50;

      background: rgba(2,10,16,.95);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid rgba(80,202,245,.14);
    }

    .header-inner {
      width: min(1440px,92%);
      height: 95px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .logo strong {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      letter-spacing: .08em;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      position: relative;

      padding: 12px 0;

      color: #a9bfca;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: .14em;
      text-transform: uppercase;
    }

    nav a:hover,
    nav a.active {
      color: #62d6ff;
    }

    nav a.active::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 2px;

      background: #52d3ff;
    }

    .home-button {
      padding: 13px 18px;

      border: 1px solid rgba(80,207,251,.42);
      border-radius: 5px;

      color: #caeffc;

      font-size: 9px;
      font-weight: 700;

      letter-spacing: .13em;
      text-transform: uppercase;
    }

    /* HERO */

    .page-hero {
      position: relative;

      min-height: 390px;

      background:
        linear-gradient(
          90deg,
          rgba(1,8,14,.97),
          rgba(3,21,34,.70),
          rgba(2,13,22,.83)
        ),
        url("hero-bg.png");

      background-size: cover;
      background-position: center 52%;

      overflow: hidden;
    }

    .page-hero::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          transparent 20%,
          #020a10 100%
        );
    }

    .page-hero-inner {
      position: relative;
      z-index: 2;

      width: min(1440px,92%);
      min-height: 390px;

      margin: auto;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      padding-bottom: 55px;
    }

    .kicker {
      margin-bottom: 12px;

      color: #55d3ff;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: .35em;
      text-transform: uppercase;
    }

    .page-title {
      font-family: 'Oswald', sans-serif;

      font-size: clamp(70px,9vw,140px);
      font-weight: 700;

      line-height: .9;
      letter-spacing: -.035em;

      text-transform: uppercase;
    }

    /* NEWS */

    .news-section {
      padding: 70px 0 105px;

      background:
        radial-gradient(
          circle at 80% 5%,
          rgba(0,157,220,.09),
          transparent 30%
        ),
        #020a10;
    }

    .news-container {
      width: min(1440px,92%);
      margin: auto;
    }

    .news-top {
      display: flex;
      align-items: flex-end;

      gap: 30px;

      margin-bottom: 30px;

      padding-bottom: 18px;

      border-bottom: 1px solid rgba(84,200,244,.15);
    }

    .news-top h2 {
      font-family: 'Oswald', sans-serif;

      font-size: 35px;
      font-weight: 600;

      text-transform: uppercase;
    }

    .news-line {
      flex: 1;
      height: 1px;

      margin-bottom: 6px;

      background:
        linear-gradient(
          90deg,
          rgba(82,207,255,.20),
          transparent
        );
    }

    .news-grid {
      display: grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap: 18px;
    }

    .news-card {
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #091c29,
          #041019
        );

      border: 1px solid rgba(73,194,237,.15);

      transition: .3s ease;
    }

    .news-card:hover {
      transform: translateY(-4px);

      border-color: rgba(79,210,255,.42);
    }

    .news-image {
      position: relative;

      aspect-ratio: 16 / 10;

      overflow: hidden;

      background: #071823;
    }

    .news-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition: transform .4s ease;
    }

    .news-card:hover .news-image img {
      transform: scale(1.04);
    }

    .news-image::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          transparent 45%,
          rgba(1,7,11,.55) 100%
        );
    }

    .news-date {
      position: absolute;

      left: 15px;
      bottom: 14px;

      z-index: 2;

      color: #e3f7ff;

      font-size: 9px;
      font-weight: 700;

      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .news-content {
      padding: 22px;
    }

    .news-title {
      color: #fff;

      font-family: 'Oswald', sans-serif;

      font-size: 23px;
      font-weight: 600;

      line-height: 1.2;

      text-transform: uppercase;
    }

    .news-description {
      margin-top: 13px;

      color: #7c9ba9;

      font-size: 11px;

      line-height: 1.7;
    }

    .news-arrow {
      display: inline-block;

      margin-top: 20px;

      color: #55d4ff;

      font-size: 20px;
    }

    .message {
      grid-column: 1 / -1;

      padding: 60px;

      border: 1px solid rgba(76,200,244,.12);

      color: #718f9e;

      text-align: center;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: .20em;
      text-transform: uppercase;
    }

    /* FOOTER */

    footer {
      background: #01070b;

      border-top: 1px solid rgba(71,197,242,.10);
    }

    .footer-inner {
      width: min(1440px,92%);
      min-height: 120px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .footer-brand img {
      width: 58px;
      height: 58px;

      object-fit: contain;
    }

    .footer-brand strong {
      font-size: 12px;

      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .footer-copy {
      color: #506a78;

      font-size: 8px;

      letter-spacing: .20em;
      text-transform: uppercase;
    }

    @media (max-width:1050px) {
      nav {
        display: none;
      }

      .news-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:650px) {
      .header-inner {
        height: 78px;
      }

      .logo img {
        width: 55px;
        height: 55px;
      }

      .logo strong {
        display: none;
      }

      .page-hero,
      .page-hero-inner {
        min-height: 310px;
      }

      .page-title {
        font-size: 65px;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;

        gap: 14px;

        padding: 25px 0;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="index.html" class="logo">
      <img src="logo.png" alt="CASPIY">

      <strong>
        CASPIY FUTSAL CLUB
      </strong>
    </a>

    <nav>
      <a href="index.html">
        БАСТЫ БЕТ
      </a>

      <a href="team.html">
        КОМАНДА
      </a>

      <a href="index.html#matches">
        МАТЧТАР
      </a>

      <a href="news.html" class="active">
        ЖАҢАЛЫҚТАР
      </a>

      <a href="#">
        КЛУБ
      </a>

      <a href="#">
        БАЙЛАНЫС
      </a>
    </nav>

    <a href="index.html" class="home-button">
      ← БАСТЫ БЕТ
    </a>

  </div>
</header>


<section class="page-hero">

  <div class="page-hero-inner">

    <div class="kicker">
      CASPIY MEDIA
    </div>

    <h1 class="page-title">
      ЖАҢАЛЫҚТАР
    </h1>

  </div>

</section>


<main class="news-section">

  <div class="news-container">

    <div class="news-top">

      <h2>
        СОҢҒЫ ЖАҢАЛЫҚТАР
      </h2>

      <div class="news-line"></div>

    </div>

    <div
      class="news-grid"
      id="news-list"
    >

      <div class="message">
        ЖАҢАЛЫҚТАР ЖҮКТЕЛУДЕ...
      </div>

    </div>

  </div>

</main>


<footer>

  <div class="footer-inner">

    <div class="footer-brand">

      <img
        src="logo.png"
        alt="CASPIY"
      >

      <strong>
        CASPIY FUTSAL CLUB
      </strong>

    </div>

    <div class="footer-copy">
      АҚТАУ · ҚАЗАҚСТАН
    </div>

  </div>

</footer>


<script type="module">

  import { createClient }
  from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


  const supabase =
    createClient(
      'https://socqbqyhkyvxnsukgcqm.supabase.co',
      'sb_publishable_l_g8YROT8Z2I3JqYHvyGQA_HIAKiqbK'
    );


  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }


  function formatDate(value) {

    if (!value) return '';

    return new Intl.DateTimeFormat(
      'kk-KZ',
      {
        timeZone: 'Asia/Aqtau',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }
    )
    .format(new Date(value))
    .toUpperCase();

  }


  async function loadNews() {

    const list =
      document.getElementById(
        'news-list'
      );


    const {
      data,
      error
    } =
      await supabase
        .from('news')
        .select(
          'id,title,description,image_url,published_at,sort_order'
        )
        .eq(
          'is_active',
          true
        )
        .order(
          'published_at',
          {
            ascending:false
          }
        )
        .order(
          'sort_order',
          {
            ascending:true
          }
        );


    if (error) {

      console.error(error);

      list.innerHTML = `
        <div class="message">
          ЖАҢАЛЫҚТАРДЫ ЖҮКТЕУ МҮМКІН БОЛМАДЫ
        </div>
      `;

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML = `
        <div class="message">
          ЖАҢАЛЫҚТАР ӘЗІРГЕ ҚОСЫЛМАҒАН
        </div>
      `;

      return;
    }


    list.innerHTML =
      data.map(item => `

        <article class="news-card">

          <div class="news-image">

            ${
              item.image_url
                ? `
                  <img
                    src="${escapeHtml(item.image_url)}"
                    alt="${escapeHtml(item.title)}"
                  >
                `
                : ''
            }

            <div class="news-date">
              ${formatDate(item.published_at)}
            </div>

          </div>


          <div class="news-content">

            <div class="news-title">
              ${escapeHtml(item.title)}
            </div>

            ${
              item.description
                ? `
                  <div class="news-description">
                    ${escapeHtml(item.description)}
                  </div>
                `
                : ''
            }

            <span class="news-arrow">
              →
            </span>

          </div>

        </article>

      `)
      .join('');

  }


  loadNews();

</script>

</body>
</html>
