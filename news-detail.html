<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Жаңалық — CASPIY Futsal Club</title>

  <meta
    id="metaDescription"
    name="description"
    content="CASPIY Futsal Club жаңалығы."
  >

  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#020a10">

  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- OPEN GRAPH -->

  <meta property="og:type" content="article">

  <meta
    property="og:site_name"
    content="CASPIY Futsal Club"
  >

  <meta
    id="ogTitle"
    property="og:title"
    content="Жаңалық — CASPIY Futsal Club"
  >

  <meta
    id="ogDescription"
    property="og:description"
    content="CASPIY Futsal Club жаңалығы."
  >

  <meta
    id="ogUrl"
    property="og:url"
    content="https://adilbeksaryyev-hub.github.io/caspiy-futsal/news-detail.html"
  >

  <meta
    id="ogImage"
    property="og:image"
    content="https://adilbeksaryyev-hub.github.io/caspiy-futsal/social-preview.png"
  >

  <meta property="og:locale" content="kk_KZ">

  <!-- TWITTER / X -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    id="twitterTitle"
    name="twitter:title"
    content="Жаңалық — CASPIY Futsal Club"
  >

  <meta
    id="twitterDescription"
    name="twitter:description"
    content="CASPIY Futsal Club жаңалығы."
  >

  <meta
    id="twitterImage"
    name="twitter:image"
    content="https://adilbeksaryyev-hub.github.io/caspiy-futsal/social-preview.png"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Montserrat', Arial, sans-serif;
      color: #f1f8fc;
      background: #020a10;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(2,10,16,.96);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(80,202,245,.14);
    }

    .header-inner {
      width: min(1440px,92%);
      height: 95px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      position: relative;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .logo strong {
      font-family: 'Oswald',sans-serif;
      font-size: 20px;
      letter-spacing: .08em;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 27px;
    }

    .desktop-nav a {
      position: relative;
      padding: 12px 0;
      color: #a9bfca;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .desktop-nav a:hover,
    .desktop-nav a.active {
      color: #62d6ff;
    }

    .desktop-nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: #52d3ff;
    }

    .header-actions {
      position: relative;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ticket-button {
      padding: 13px 18px;
      color: #caeffc;
      border: 1px solid rgba(80,207,251,.42);
      border-radius: 5px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .ticket-button.disabled {
      opacity: .35;
      pointer-events: none;
    }

    /* MOBILE */

    .mobile-menu-button {
      display: none;
      width: 46px;
      height: 46px;
      align-items: center;
      justify-content: center;
      background: rgba(4,22,34,.90);
      border: 1px solid rgba(77,205,255,.32);
      border-radius: 5px;
      cursor: pointer;
    }

    .mobile-lines {
      position: relative;
      width: 21px;
      height: 15px;
    }

    .mobile-lines span {
      position: absolute;
      left: 0;
      width: 21px;
      height: 2px;
      background: #cbeffc;
      transition: .25s;
    }

    .mobile-lines span:nth-child(1) { top: 0; }
    .mobile-lines span:nth-child(2) { top: 6px; }
    .mobile-lines span:nth-child(3) { top: 12px; }

    .mobile-menu-button.active .mobile-lines span:nth-child(1) {
      top: 6px;
      transform: rotate(45deg);
    }

    .mobile-menu-button.active .mobile-lines span:nth-child(2) {
      opacity: 0;
    }

    .mobile-menu-button.active .mobile-lines span:nth-child(3) {
      top: 6px;
      transform: rotate(-45deg);
    }

    .mobile-menu {
      position: fixed;
      z-index: 45;
      inset: 0;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateX(100%);
      transition: .3s;
      background:
        radial-gradient(
          circle at 80% 15%,
          rgba(32,175,226,.18),
          transparent 30%
        ),
        rgba(1,9,15,.99);
    }

    .mobile-menu.open {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .mobile-menu-inner {
      width: min(540px,88%);
      height: 100%;
      margin: auto;
      padding: 125px 0 40px;
      display: flex;
      flex-direction: column;
    }

    .mobile-menu-small {
      margin-bottom: 25px;
      color: #51cffb;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .28em;
    }

    .mobile-nav {
      display: flex;
      flex-direction: column;
    }

    .mobile-nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      color: #d6e8f0;
      border-bottom: 1px solid rgba(91,204,244,.11);
      font-family: 'Oswald',sans-serif;
      font-size: 28px;
      text-transform: uppercase;
    }

    .mobile-nav a::after {
      content: "→";
      color: #54d5ff;
      font-size: 18px;
    }

    .mobile-nav a.active {
      color: #58d5ff;
    }

    .mobile-ticket {
      margin-top: 30px;
      padding: 16px 20px;
      text-align: center;
      color: #031019;
      background: #56d5ff;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 800;
    }

    .mobile-ticket.disabled {
      opacity: .30;
      pointer-events: none;
    }

    .mobile-address {
      margin-top: auto;
      color: #4f7080;
      font-size: 9px;
      letter-spacing: .18em;
    }

    /* ARTICLE */

    .article {
      padding: 70px 0 110px;
      background:
        radial-gradient(
          circle at 85% 5%,
          rgba(0,160,220,.10),
          transparent 30%
        ),
        #020a10;
    }

    .article-inner {
      width: min(1050px,92%);
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 42px;
      color: #58d5ff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .article-label {
      color: #58d5ff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .30em;
      text-transform: uppercase;
    }

    .article-title {
      margin-top: 15px;
      font-family: 'Oswald',sans-serif;
      font-size: clamp(44px,7vw,92px);
      font-weight: 600;
      line-height: 1;
      text-transform: uppercase;
    }

    .article-date {
      margin-top: 22px;
      color: #718f9f;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .article-image {
      width: 100%;
      margin-top: 45px;
      overflow: hidden;
      background: #071824;
      border: 1px solid rgba(75,200,244,.15);
    }

    .article-image img {
      display: block;
      width: 100%;
      max-height: 680px;
      object-fit: cover;
    }

    .article-body {
      max-width: 850px;
      margin: 48px auto 0;
      color: #9ab2bd;
      font-size: 14px;
      line-height: 2;
    }

    .article-body p {
      margin-bottom: 24px;
    }

    .loading,
    .error {
      padding: 130px 20px;
      text-align: center;
      color: #718f9f;
      font-size: 11px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    /* FOOTER */

    footer {
      background: #01070b;
      border-top: 1px solid rgba(71,197,242,.10);
    }

    .footer-inner {
      width: min(1440px,92%);
      min-height: 120px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .footer-brand img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .footer-brand strong {
      font-size: 12px;
      letter-spacing: .17em;
    }

    .footer-copy {
      color: #506a78;
      font-size: 8px;
      letter-spacing: .20em;
    }

    @media (max-width:900px) {
      .desktop-nav,
      .ticket-button {
        display: none;
      }

      .mobile-menu-button {
        display: flex;
      }
    }

    @media (max-width:650px) {
      .header-inner {
        height: 78px;
      }

      .logo img {
        width: 55px;
        height: 55px;
      }

      .logo strong {
        display: none;
      }

      .article {
        padding: 45px 0 80px;
      }

      .article-title {
        font-size: 45px;
      }

      .article-image {
        margin-top: 32px;
      }

      .article-body {
        margin-top: 32px;
        font-size: 13px;
      }

      .mobile-menu-inner {
        padding-top: 105px;
      }

      .mobile-nav a {
        min-height: 55px;
        font-size: 25px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 25px 0;
      }
    }
  </style>
</head>

<body>

<div class="mobile-menu" id="mobileMenu">

  <div class="mobile-menu-inner">

    <div class="mobile-menu-small">
      CASPIY FUTSAL CLUB
    </div>

    <nav class="mobile-nav">
      <a href="index.html">БАСТЫ БЕТ</a>
      <a href="team.html">КОМАНДА</a>
      <a href="matches.html">МАТЧТАР</a>
      <a href="news.html" class="active">ЖАҢАЛЫҚТАР</a>
      <a href="club.html">КЛУБ</a>
      <a href="fans.html">ЖАНКҮЙЕРЛЕР</a>
      <a href="contact.html">БАЙЛАНЫС</a>
    </nav>

    <a
      href="#"
      id="mobileTicketButton"
      class="mobile-ticket disabled"
      target="_blank"
      rel="noopener noreferrer"
    >
      БИЛЕТТЕР →
    </a>

    <div class="mobile-address" id="mobileAddress">
      АҚТАУ · ҚАЗАҚСТАН
    </div>

  </div>

</div>

<header>

  <div class="header-inner">

    <a href="index.html" class="logo">
      <img src="logo.png" alt="CASPIY Futsal Club">
      <strong>CASPIY FUTSAL CLUB</strong>
    </a>

    <nav class="desktop-nav">
      <a href="index.html">БАСТЫ БЕТ</a>
      <a href="team.html">КОМАНДА</a>
      <a href="matches.html">МАТЧТАР</a>
      <a href="news.html" class="active">ЖАҢАЛЫҚТАР</a>
      <a href="club.html">КЛУБ</a>
      <a href="fans.html">ЖАНКҮЙЕРЛЕР</a>
      <a href="contact.html">БАЙЛАНЫС</a>
    </nav>

    <div class="header-actions">

      <a
        href="#"
        id="ticketButton"
        class="ticket-button disabled"
        target="_blank"
        rel="noopener noreferrer"
      >
        БИЛЕТТЕР →
      </a>

      <button
        class="mobile-menu-button"
        id="mobileMenuButton"
        type="button"
        aria-label="Мәзір"
        aria-expanded="false"
      >
        <span class="mobile-lines">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

    </div>

  </div>

</header>


<main class="article">

  <div
    class="article-inner"
    id="articleContainer"
  >

    <div class="loading">
      ЖАҢАЛЫҚ ЖҮКТЕЛУДЕ...
    </div>

  </div>

</main>


<footer>

  <div class="footer-inner">

    <div class="footer-brand">
      <img src="logo.png" alt="CASPIY">
      <strong>CASPIY FUTSAL CLUB</strong>
    </div>

    <div class="footer-copy" id="footerAddress">
      АҚТАУ · ҚАЗАҚСТАН
    </div>

  </div>

</footer>


<script type="module">

  import { createClient }
  from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


  const supabase = createClient(
    'https://socqbqyhkyvxnsukgcqm.supabase.co',
    'sb_publishable_l_g8YROT8Z2I3JqYHvyGQA_HIAKiqbK'
  );


  const mobileMenu =
    document.getElementById('mobileMenu');

  const mobileMenuButton =
    document.getElementById('mobileMenuButton');


  function closeMenu() {

    mobileMenu.classList.remove('open');
    mobileMenuButton.classList.remove('active');

    mobileMenuButton.setAttribute(
      'aria-expanded',
      'false'
    );

    document.body.classList.remove('menu-open');

  }


  mobileMenuButton.addEventListener(
    'click',
    () => {

      const opened =
        mobileMenu.classList.toggle('open');

      mobileMenuButton.classList.toggle(
        'active',
        opened
      );

      mobileMenuButton.setAttribute(
        'aria-expanded',
        String(opened)
      );

      document.body.classList.toggle(
        'menu-open',
        opened
      );

    }
  );


  mobileMenu
    .querySelectorAll('a')
    .forEach(
      link =>
        link.addEventListener(
          'click',
          closeMenu
        )
    );


  function escapeHtml(value) {

    return String(value ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");

  }


  function formatDate(value) {

    if (!value) return '';

    return new Intl.DateTimeFormat(
      'kk-KZ',
      {
        timeZone:'Asia/Aqtau',
        day:'numeric',
        month:'long',
        year:'numeric'
      }
    )
    .format(new Date(value))
    .toUpperCase();

  }


  function descriptionText(text) {

    return String(text || '')
      .replace(/\s+/g,' ')
      .trim()
      .slice(0,160);

  }


  function renderParagraphs(text) {

    if (!text) {
      return '';
    }

    return String(text)
      .split(/\n+/)
      .filter(Boolean)
      .map(
        part =>
          `<p>${escapeHtml(part.trim())}</p>`
      )
      .join('');

  }


  async function loadSettings() {

    const { data } =
      await supabase
        .from('site_settings')
        .select('ticket_url,address')
        .eq('id',1)
        .maybeSingle();


    if (!data) return;


    if (data.ticket_url) {

      [
        document.getElementById('ticketButton'),
        document.getElementById('mobileTicketButton')
      ]
      .forEach(
        button => {

          button.href =
            data.ticket_url;

          button.classList.remove(
            'disabled'
          );

        }
      );

    }


    if (data.address) {

      const address =
        data.address.toUpperCase();

      document.getElementById(
        'footerAddress'
      ).textContent =
        address;

      document.getElementById(
        'mobileAddress'
      ).textContent =
        address;

    }

  }


  async function loadArticle() {

    const container =
      document.getElementById(
        'articleContainer'
      );


    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      Number(
        params.get('id')
      );


    if (
      !id ||
      !Number.isInteger(id)
    ) {

      container.innerHTML = `
        <div class="error">
          ЖАҢАЛЫҚ ТАБЫЛМАДЫ
        </div>
      `;

      return;

    }


    const {
      data,
      error
    } =
      await supabase
        .from('news')
        .select(
          'id,title,description,image_url,published_at,is_active'
        )
        .eq('id',id)
        .eq('is_active',true)
        .maybeSingle();


    if (
      error ||
      !data
    ) {

      container.innerHTML = `
        <div class="error">
          ЖАҢАЛЫҚ ТАБЫЛМАДЫ
        </div>
      `;

      return;

    }


    const description =
      descriptionText(
        data.description
      ) ||
      'CASPIY Futsal Club жаңалығы.';


    const currentUrl =
      window.location.href;


    const previewImage =
      data.image_url ||
      'https://adilbeksaryyev-hub.github.io/caspiy-futsal/social-preview.png';


    /* DYNAMIC SEO */

    document.title =
      `${data.title} — CASPIY Futsal Club`;


    document
      .getElementById('metaDescription')
      .setAttribute(
        'content',
        description
      );


    document
      .getElementById('ogTitle')
      .setAttribute(
        'content',
        data.title
      );


    document
      .getElementById('ogDescription')
      .setAttribute(
        'content',
        description
      );


    document
      .getElementById('ogUrl')
      .setAttribute(
        'content',
        currentUrl
      );


    document
      .getElementById('ogImage')
      .setAttribute(
        'content',
        previewImage
      );


    document
      .getElementById('twitterTitle')
      .setAttribute(
        'content',
        data.title
      );


    document
      .getElementById('twitterDescription')
      .setAttribute(
        'content',
        description
      );


    document
      .getElementById('twitterImage')
      .setAttribute(
        'content',
        previewImage
      );


    /* ARTICLE */

    container.innerHTML = `

      <a
        href="news.html"
        class="back"
      >
        ← БАРЛЫҚ ЖАҢАЛЫҚТАР
      </a>


      <div class="article-label">
        CASPIY NEWS
      </div>


      <h1 class="article-title">
        ${escapeHtml(data.title)}
      </h1>


      <div class="article-date">
        ${formatDate(data.published_at)}
      </div>


      ${
        data.image_url
          ? `
            <div class="article-image">
              <img
                src="${escapeHtml(data.image_url)}"
                alt="${escapeHtml(data.title)}"
              >
            </div>
          `
          : ''
      }


      <article class="article-body">

        ${
          renderParagraphs(
            data.description
          ) ||
          '<p>Толық ақпарат жақын арада жарияланады.</p>'
        }

      </article>

    `;

  }


  await Promise.all([
    loadSettings(),
    loadArticle()
  ]);

</script>

</body>
</html>
