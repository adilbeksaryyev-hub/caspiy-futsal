<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Команда — CASPIY Futsal Club</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family: 'Montserrat', Arial, sans-serif;

      color: #f4fbff;

      background:
        radial-gradient(
          circle at 70% 0%,
          rgba(0,150,220,.13),
          transparent 30%
        ),
        #020a10;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;

      background:
        rgba(2,10,16,.94);

      backdrop-filter:
        blur(14px);

      border-bottom:
        1px solid rgba(80,202,245,.14);
    }

    .header-inner {
      width: min(1440px,92%);
      height: 95px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;

      gap: 14px;
    }

    .logo img {
      width: 70px;
      height: 70px;

      object-fit: contain;
    }

    .logo-text strong {
      display: block;

      font-family: 'Oswald',sans-serif;

      font-size: 20px;
      font-weight: 700;

      letter-spacing: .08em;
    }

    .logo-text span {
      display: block;

      margin-top: 3px;

      color: #668899;

      font-size: 8px;

      letter-spacing: .24em;

      text-transform: uppercase;
    }

    nav {
      display: flex;
      align-items: center;

      gap: 31px;
    }

    nav a {
      position: relative;

      padding: 12px 0;

      color: #a9bfca;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: .14em;

      text-transform: uppercase;
    }

    nav a:hover,
    nav a.active {
      color: #62d6ff;
    }

    nav a.active::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 2px;

      background: #52d3ff;
    }

    .back-button {
      padding: 13px 19px;

      border:
        1px solid rgba(80,207,251,.45);

      border-radius: 5px;

      color: #caeffc;

      font-size: 9px;
      font-weight: 700;

      letter-spacing: .13em;

      text-transform: uppercase;

      transition: .2s;
    }

    .back-button:hover {
      background:
        rgba(67,196,242,.09);
    }


    /* =====================================================
       PAGE HERO
       ===================================================== */

    .page-hero {
      position: relative;

      min-height: 420px;

      overflow: hidden;

      background:
        linear-gradient(
          90deg,
          rgba(1,8,14,.97),
          rgba(3,21,34,.73),
          rgba(2,13,22,.84)
        ),
        url("hero-bg.png");

      background-size: cover;
      background-position: center 55%;
    }

    .page-hero::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          transparent 20%,
          #020a10 100%
        );
    }

    .page-hero-inner {
      position: relative;
      z-index: 2;

      width: min(1440px,92%);
      height: 420px;

      margin: auto;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      padding-bottom: 62px;
    }

    .page-kicker {
      margin-bottom: 12px;

      color: #55d3ff;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: .35em;

      text-transform: uppercase;
    }

    .page-title {
      font-family: 'Oswald',sans-serif;

      font-size:
        clamp(
          70px,
          9vw,
          145px
        );

      font-weight: 700;

      line-height: .9;

      letter-spacing: -.035em;

      text-transform: uppercase;
    }

    .page-description {
      max-width: 590px;

      margin-top: 25px;

      color: #83a1b1;

      font-size: 11px;
      font-weight: 500;

      line-height: 1.9;

      letter-spacing: .11em;

      text-transform: uppercase;
    }


    /* =====================================================
       TEAM
       ===================================================== */

    .team-section {
      padding:
        70px 0
        105px;
    }

    .team-container {
      width: min(1440px,92%);
      margin: auto;
    }


    /* POSITION GROUP */

    .position-group {
      margin-bottom: 85px;
    }

    .position-group:last-child {
      margin-bottom: 0;
    }

    .position-header {
      display: flex;
      align-items: flex-end;

      gap: 26px;

      margin-bottom: 25px;

      padding-bottom: 15px;

      border-bottom:
        1px solid rgba(83,199,242,.16);
    }

    .position-number {
      color:
        rgba(78,207,255,.22);

      font-family: 'Oswald',sans-serif;

      font-size: 44px;
      font-weight: 700;

      line-height: 1;
    }

    .position-title {
      font-family: 'Oswald',sans-serif;

      font-size:
        clamp(
          29px,
          3vw,
          43px
        );

      font-weight: 600;

      line-height: 1;

      text-transform: uppercase;
    }

    .position-line {
      flex: 1;

      height: 1px;

      margin-bottom: 5px;

      background:
        linear-gradient(
          90deg,
          rgba(86,207,250,.22),
          transparent
        );
    }


    /* PLAYER GRID */

    .players-grid {
      display: grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap: 15px;
    }

    .player-card {
      position: relative;

      min-height: 500px;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #102431,
          #030a0f
        );

      border:
        1px solid rgba(84,200,244,.13);

      transition:
        transform .28s ease,
        border-color .28s ease;
    }

    .player-card:hover {
      transform:
        translateY(-4px);

      border-color:
        rgba(76,207,255,.44);
    }

    .player-card::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 1;

      background:
        radial-gradient(
          circle at 50% 88%,
          rgba(0,145,220,.26),
          transparent 43%
        );

      pointer-events: none;
    }

    .player-photo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center top;

      filter:
        saturate(.78)
        contrast(1.05);

      transition:
        transform .5s ease;
    }

    .player-card:hover
    .player-photo {
      transform:
        scale(1.035);
    }

    .player-overlay {
      position: absolute;
      inset: 0;

      z-index: 1;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.03) 0%,
          rgba(0,0,0,.04) 45%,
          rgba(1,7,11,.50) 68%,
          rgba(1,6,10,.98) 100%
        );
    }

    .player-number {
      position: absolute;

      top: 18px;
      right: 18px;

      z-index: 3;

      color:
        rgba(255,255,255,.92);

      font-family: 'Oswald',sans-serif;

      font-size: 105px;
      font-weight: 700;

      line-height: .85;

      text-shadow:
        0 6px 20px rgba(0,0,0,.35);
    }

    .player-info {
      position: absolute;

      left: 25px;
      right: 20px;
      bottom: 27px;

      z-index: 3;
    }

    .player-name {
      max-width: 240px;

      color: #fff;

      font-family: 'Oswald',sans-serif;

      font-size: 28px;
      font-weight: 600;

      line-height: 1.05;

      text-transform: uppercase;
    }

    .player-position {
      margin-top: 11px;

      color: #58cdef;

      font-size: 9px;
      font-weight: 700;

      letter-spacing: .20em;

      text-transform: uppercase;
    }

    .no-photo {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color:
        rgba(120,181,207,.22);

      font-family: 'Oswald',sans-serif;

      font-size: 120px;
      font-weight: 700;
    }


    /* EMPTY / LOADING */

    .team-message {
      padding: 60px;

      color: #718f9e;

      text-align: center;

      border:
        1px solid rgba(76,200,244,.12);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: .20em;

      text-transform: uppercase;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    footer {
      background: #01070b;

      border-top:
        1px solid rgba(71,197,242,.10);
    }

    .footer-inner {
      width: min(1440px,92%);
      min-height: 120px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .footer-brand {
      display: flex;
      align-items: center;

      gap: 14px;
    }

    .footer-brand img {
      width: 58px;
      height: 58px;

      object-fit: contain;
    }

    .footer-brand strong {
      font-size: 12px;

      letter-spacing: .17em;

      text-transform: uppercase;
    }

    .footer-copy {
      color: #506a78;

      font-size: 8px;

      letter-spacing: .20em;

      text-transform: uppercase;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width:1150px) {

      nav {
        display: none;
      }

      .players-grid {
        grid-template-columns:
          repeat(3,minmax(0,1fr));
      }

    }


    @media (max-width:850px) {

      .header-inner {
        height: 78px;
      }

      .logo img {
        width: 55px;
        height: 55px;
      }

      .logo-text {
        display: none;
      }

      .page-hero,
      .page-hero-inner {
        min-height: 330px;
        height: 330px;
      }

      .players-grid {
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

      .player-card {
        min-height: 430px;
      }

    }


    @media (max-width:560px) {

      .back-button {
        padding:
          11px 13px;

        font-size: 8px;
      }

      .page-title {
        font-size: 68px;
      }

      .page-description {
        font-size: 9px;
      }

      .team-section {
        padding-top: 50px;
      }

      .position-group {
        margin-bottom: 60px;
      }

      .position-number {
        font-size: 32px;
      }

      .position-title {
        font-size: 27px;
      }

      .players-grid {
        grid-template-columns: 1fr;
      }

      .player-card {
        min-height: 540px;
      }

      .player-number {
        font-size: 115px;
      }

      .player-name {
        font-size: 30px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;

        padding:
          25px 0;
      }

    }
  </style>
</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">

  <div class="header-inner">

    <a
      href="index.html"
      class="logo"
    >

      <img
        src="logo.png"
        alt="CASPIY"
      >

      <div class="logo-text">

        <strong>
          CASPIY
        </strong>

        <span>
          FUTSAL CLUB
        </span>

      </div>

    </a>


    <nav>

      <a href="index.html">
        БАСТЫ БЕТ
      </a>

      <a
        href="team.html"
        class="active"
      >
        КОМАНДА
      </a>

      <a href="index.html#matches">
        МАТЧТАР
      </a>

      <a href="index.html#news">
        ЖАҢАЛЫҚТАР
      </a>

      <a href="#">
        КЛУБ
      </a>

      <a href="#">
        БАЙЛАНЫС
      </a>

    </nav>


    <a
      href="index.html"
      class="back-button"
    >
      ← БАСТЫ БЕТ
    </a>

  </div>

</header>



<!-- =====================================================
     HERO
     ===================================================== -->

<section class="page-hero">

  <div class="page-hero-inner">

    <div class="page-kicker">
      CASPIY FUTSAL CLUB
    </div>

    <h1 class="page-title">
      КОМАНДА
    </h1>

    <div class="page-description">
      CASPIY FUTSAL CLUB КОМАНДАСЫНЫҢ
      РЕСМИ ҚҰРАМЫ
    </div>

  </div>

</section>



<!-- =====================================================
     TEAM
     ===================================================== -->

<main class="team-section">

  <div
    class="team-container"
    id="team-container"
  >

    <div class="team-message">
      ОЙЫНШЫЛАР ЖҮКТЕЛУДЕ...
    </div>

  </div>

</main>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer>

  <div class="footer-inner">

    <div class="footer-brand">

      <img
        src="logo.png"
        alt="CASPIY"
      >

      <strong>
        CASPIY FUTSAL CLUB
      </strong>

    </div>

    <div class="footer-copy">
      АҚТАУ · ҚАЗАҚСТАН
    </div>

  </div>

</footer>



<!-- =====================================================
     SUPABASE
     ===================================================== -->

<script type="module">

  import { createClient }
  from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


  const supabase =
    createClient(
      'https://socqbqyhkyvxnsukgcqm.supabase.co',
      'sb_publishable_l_g8YROT8Z2I3JqYHvyGQA_HIAKiqbK'
    );


  function escapeHtml(value) {

    return String(value ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");

  }


  const groups = [

    {
      key: 'ҚАҚПАШЫ',
      title: 'ҚАҚПАШЫЛАР'
    },

    {
      key: 'ҚОРҒАУШЫ',
      title: 'ҚОРҒАУШЫЛАР'
    },

    {
      key: 'ӘМБЕБАП',
      title: 'ӘМБЕБАПТАР'
    },

    {
      key: 'ШАБУЫЛШЫ',
      title: 'ШАБУЫЛШЫЛАР'
    }

  ];


  function playerCard(player) {

    const photo =
      player.photo_url

        ? `
          <img
            class="player-photo"
            src="${escapeHtml(player.photo_url)}"
            alt="${escapeHtml(player.name)}"
          >
        `

        : `
          <div class="no-photo">
            ${player.number ?? ''}
          </div>
        `;


    return `

      <article class="player-card">

        ${photo}

        <div class="player-overlay"></div>

        <div class="player-number">
          ${player.number ?? ''}
        </div>

        <div class="player-info">

          <div class="player-name">
            ${escapeHtml(player.name)}
          </div>

          <div class="player-position">
            ${escapeHtml(player.position || '')}
          </div>

        </div>

      </article>

    `;

  }


  async function loadTeam() {

    const container =
      document.getElementById(
        'team-container'
      );


    const {
      data,
      error
    } =
      await supabase
        .from('players')
        .select(
          'id,name,number,position,photo_url,sort_order'
        )
        .eq(
          'is_active',
          true
        )
        .order(
          'sort_order',
          {
            ascending: true
          }
        )
        .order(
          'number',
          {
            ascending: true
          }
        );


    if (error) {

      console.error(error);

      container.innerHTML = `

        <div class="team-message">
          ОЙЫНШЫЛАРДЫ ЖҮКТЕУ МҮМКІН БОЛМАДЫ
        </div>

      `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      container.innerHTML = `

        <div class="team-message">
          ОЙЫНШЫЛАР ӘЗІРГЕ ҚОСЫЛМАҒАН
        </div>

      `;

      return;

    }


    let html = '';

    let visibleGroupNumber = 1;


    groups.forEach(group => {

      const players =
        data.filter(
          player =>
            String(
              player.position || ''
            )
            .toUpperCase()
            .trim() ===
            group.key
        );


      if (
        players.length === 0
      ) {
        return;
      }


      html += `

        <section class="position-group">

          <div class="position-header">

            <div class="position-number">
              ${String(visibleGroupNumber).padStart(2,'0')}
            </div>

            <h2 class="position-title">
              ${group.title}
            </h2>

            <div class="position-line"></div>

          </div>


          <div class="players-grid">

            ${
              players
                .map(playerCard)
                .join('')
            }

          </div>

        </section>

      `;


      visibleGroupNumber++;

    });


    const knownPositions =
      groups.map(
        group =>
          group.key
      );


    const otherPlayers =
      data.filter(
        player =>
          !knownPositions.includes(
            String(
              player.position || ''
            )
            .toUpperCase()
            .trim()
          )
      );


    if (
      otherPlayers.length > 0
    ) {

      html += `

        <section class="position-group">

          <div class="position-header">

            <div class="position-number">
              ${String(visibleGroupNumber).padStart(2,'0')}
            </div>

            <h2 class="position-title">
              КОМАНДА
            </h2>

            <div class="position-line"></div>

          </div>


          <div class="players-grid">

            ${
              otherPlayers
                .map(playerCard)
                .join('')
            }

          </div>

        </section>

      `;

    }


    container.innerHTML =
      html;

  }


  loadTeam();

</script>


</body>
</html>
