<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>КАСПИЙ — Админ-панель</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 70% 10%, rgba(20,132,190,.16), transparent 30%),
        #020b12;
      color: #fff;
      min-height: 100vh;
    }

    .wrap {
      width: min(1000px, calc(100% - 32px));
      margin: auto;
      padding: 50px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 35px;
    }

    .brand img {
      width: 76px;
      height: 76px;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 3px;
    }

    .brand span {
      display: block;
      margin-top: 5px;
      color: #58d6ff;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .card {
      background: rgba(5,22,34,.94);
      border: 1px solid rgba(70,205,255,.28);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
    }

    h3 {
      margin: 0 0 10px;
    }

    .muted {
      color: #879cab;
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #9fc6d8;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      background: #061522;
      color: #fff;
      border: 1px solid #20445a;
      border-radius: 6px;
      padding: 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #42cfff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #28bdf4;
      color: #02111b;
    }

    .secondary {
      background: #102838;
      color: #d4edf7;
    }

    .danger {
      background: #431e27;
      color: #ffb0bc;
    }

    .green {
      background: #123b2d;
      color: #8cf1b9;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    #admin-panel {
      display: none;
    }

    #message,
    #team-message,
    #login-message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .success {
      display: block !important;
      background: rgba(28,153,92,.14);
      border: 1px solid rgba(58,214,132,.4);
      color: #82efb5;
    }

    .error {
      display: block !important;
      background: rgba(190,49,70,.14);
      border: 1px solid rgba(255,94,117,.4);
      color: #ff9dab;
    }

    .statusbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .email {
      color: #54d0ff;
      font-size: 13px;
    }

    .match-list {
      display: grid;
      gap: 14px;
    }

    .match-item {
      border: 1px solid rgba(80,200,255,.18);
      background: rgba(3,18,29,.72);
      border-radius: 8px;
      padding: 18px;
    }

    .match-item.featured {
      border-color: #42cfff;
      box-shadow: 0 0 22px rgba(25,185,245,.10);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .match-team {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .match-team img {
      width: 54px;
      height: 54px;
      object-fit: contain;
    }

    .match-title {
      font-size: 17px;
      font-weight: 700;
    }

    .match-meta {
      margin-top: 5px;
      color: #829aaa;
      font-size: 12px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 4px;
      background: #10344a;
      color: #63d5ff;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score {
      font-size: 26px;
      font-weight: 800;
      margin-top: 8px;
    }

    .separator {
      border: 0;
      border-top: 1px solid rgba(255,255,255,.08);
      margin: 38px 0;
    }

    .teams-list {
      margin-top: 25px;
      display: grid;
      gap: 12px;
    }

    .team-admin-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 13px;
      border: 1px solid rgba(70,205,255,.18);
      background: rgba(3,18,29,.7);
      border-radius: 7px;
    }

    .team-admin-item img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    @media(max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px;
      }

      .match-top {
        flex-direction: column;
      }

      .wrap {
        padding: 25px 0;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <img src="../logo.png" alt="Каспий">

    <div>
      <h1>КАСПИЙ</h1>
      <span>ADMIN PANEL</span>
    </div>
  </div>


  <!-- LOGIN -->

  <div class="card" id="login-panel">

    <h2>Вход администратора</h2>

    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email">
    </div>

    <div class="field">
      <label>Пароль</label>
      <input type="password" id="password">
    </div>

    <button class="primary" id="login-btn">
      Войти
    </button>

    <div id="login-message"></div>

  </div>


  <!-- ADMIN -->

  <div id="admin-panel">

    <div class="card">

      <div class="statusbar">

        <div>
          <div class="muted">Вы вошли как</div>
          <div class="email" id="admin-email"></div>
        </div>

        <div class="buttons">
          <button class="secondary" id="site-btn">
            Открыть сайт
          </button>

          <button class="secondary" id="logout-btn">
            Выйти
          </button>
        </div>

      </div>

    </div>


    <!-- MATCH FORM -->

    <div class="card">

      <h2 id="match-form-title">
        Добавить матч
      </h2>

      <input type="hidden" id="editing-match-id">


      <div class="field">

        <label>Соперник</label>

        <select id="opponent">
          <option value="">Выберите команду</option>
        </select>

      </div>


      <div class="grid">

        <div class="field">
          <label>Дата и время</label>
          <input type="datetime-local" id="match_date">
        </div>

        <div class="field">
          <label>Турнир</label>
          <input
            type="text"
            id="competition"
            placeholder="Чемпионат Казахстана"
          >
        </div>

      </div>


      <div class="field">

        <label>Арена</label>

        <input
          type="text"
          id="venue"
          placeholder="BS Arena"
        >

      </div>


      <div class="grid">

        <div class="field">

          <label>Каспий играет</label>

          <select id="is_home">
            <option value="true">Дома</option>
            <option value="false">В гостях</option>
          </select>

        </div>

        <div class="field">

          <label>Статус</label>

          <select id="status">
            <option value="upcoming">Предстоящий</option>
            <option value="finished">Завершён</option>
            <option value="postponed">Перенесён</option>
          </select>

        </div>

      </div>


      <div class="grid">

        <div class="field">

          <label>Голы Каспия</label>

          <input
            type="number"
            id="caspiy_score"
            min="0"
            placeholder="0"
          >

        </div>

        <div class="field">

          <label>Голы соперника</label>

          <input
            type="number"
            id="opponent_score"
            min="0"
            placeholder="0"
          >

        </div>

      </div>


      <div class="buttons">

        <button class="primary" id="save-match-btn">
          Сохранить матч
        </button>

        <button class="secondary" id="clear-match-btn">
          Очистить форму
        </button>

      </div>

      <div id="message"></div>

    </div>


    <!-- MATCH LIST -->

    <div class="card">

      <h2>Все матчи</h2>

      <div id="matches-list" class="match-list"></div>

    </div>


    <!-- TEAMS -->

    <div class="card">

      <h2>Команды</h2>

      <p class="muted">
        Добавление соперников и официальных логотипов.
      </p>


      <div class="grid">

        <div class="field">

          <label>Название команды</label>

          <input
            type="text"
            id="team-name"
            placeholder="Например: Байтерек"
          >

        </div>

        <div class="field">

          <label>Город</label>

          <input
            type="text"
            id="team-city"
            placeholder="Например: Орал"
          >

        </div>

      </div>


      <div class="field">

        <label>Логотип команды</label>

        <input
          type="file"
          id="team-logo-file"
          accept="image/png,image/jpeg,image/webp,image/svg+xml"
        >

      </div>


      <button class="primary" id="add-team-btn">
        Добавить команду
      </button>


      <div id="team-message"></div>

      <div id="teams-list" class="teams-list"></div>

    </div>

  </div>

</div>


<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const supabase = createClient(
  'https://socqbqyhkyvxnsukgcqm.supabase.co',
  'sb_publishable_l_g8YROT8Z2I3JqYHvyGQA_HIAKiqbK'
);


let teamsCache = [];
let matchesCache = [];


const loginPanel =
  document.getElementById('login-panel');

const adminPanel =
  document.getElementById('admin-panel');

const message =
  document.getElementById('message');

const teamMessage =
  document.getElementById('team-message');


function showMessage(text, type = 'success') {

  message.textContent = text;
  message.className = type;

}


function showTeamMessage(text, type = 'success') {

  teamMessage.textContent = text;
  teamMessage.className = type;

}


function getTeamFullName(team) {

  return team.city
    ? `${team.name} ${team.city}`
    : team.name;

}


function formatDate(value) {

  if (!value) return '';

  return new Intl.DateTimeFormat(
    'ru-RU',
    {
      timeZone: 'Asia/Aqtau',
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }
  ).format(new Date(value));

}


function toInputDate(value) {

  if (!value) return '';

  const date = new Date(value);

  const parts =
    new Intl.DateTimeFormat(
      'sv-SE',
      {
        timeZone: 'Asia/Aqtau',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }
    ).format(date);

  return parts.replace(' ', 'T');

}


async function loadTeams() {

  const { data, error } =
    await supabase
      .from('teams')
      .select('*')
      .eq('is_active', true)
      .order('name');


  if (error) {

    console.error(error);

    return;

  }


  teamsCache = data || [];


  const select =
    document.getElementById('opponent');


  const oldValue =
    select.value;


  select.innerHTML =
    '<option value="">Выберите команду</option>';


  teamsCache.forEach(team => {

    const option =
      document.createElement('option');

    option.value =
      String(team.id);

    option.textContent =
      team.city
        ? `${team.name} — ${team.city}`
        : team.name;

    select.appendChild(option);

  });


  if (oldValue) {
    select.value = oldValue;
  }


  const list =
    document.getElementById('teams-list');


  list.innerHTML =
    teamsCache.map(team => `

      <div class="team-admin-item">

        ${
          team.logo_url
            ? `<img src="${team.logo_url}">`
            : ''
        }

        <div>
          <strong>${team.name}</strong>
          <div class="muted">
            ${team.city || ''}
          </div>
        </div>

      </div>

    `).join('');

}


async function loadMatches() {

  const { data, error } =
    await supabase
      .from('matches')
      .select('*')
      .order('match_date', {
        ascending: false
      });


  if (error) {

    showMessage(
      'Ошибка загрузки матчей: ' +
      error.message,
      'error'
    );

    return;

  }


  matchesCache =
    data || [];


  renderMatches();

}


function renderMatches() {

  const list =
    document.getElementById('matches-list');


  if (!matchesCache.length) {

    list.innerHTML =
      '<div class="muted">Матчей пока нет.</div>';

    return;

  }


  list.innerHTML =
    matchesCache.map(match => {

      const score =
        match.caspiy_score !== null &&
        match.opponent_score !== null

        ? `
          <div class="score">
            ${match.caspiy_score}
            :
            ${match.opponent_score}
          </div>
        `

        : '';


      return `

        <div
          class="match-item
          ${match.is_featured ? 'featured' : ''}"
        >

          <div class="match-top">

            <div class="match-team">

              ${
                match.opponent_logo_url
                  ? `
                    <img
                      src="${match.opponent_logo_url}"
                    >
                  `
                  : ''
              }

              <div>

                <div class="match-title">
                  КАСПИЙ — ${match.opponent}
                </div>

                <div class="match-meta">

                  ${formatDate(match.match_date)}
                  <br>

                  ${match.competition || ''}
                  <br>

                  ${match.venue || ''}

                </div>

                ${score}

              </div>

            </div>


            <div>

              ${
                match.is_featured
                  ? `<span class="badge">
                       На главной
                     </span>`
                  : ''
              }

            </div>

          </div>


          <div class="buttons">

            <button
              class="secondary"
              data-action="edit"
              data-id="${match.id}"
            >
              Редактировать
            </button>


            ${
              !match.is_featured

                ? `
                  <button
                    class="green"
                    data-action="featured"
                    data-id="${match.id}"
                  >
                    Сделать ближайшим
                  </button>
                `

                : ''
            }


            <button
              class="danger"
              data-action="delete"
              data-id="${match.id}"
            >
              Удалить
            </button>

          </div>

        </div>

      `;

    }).join('');

}


function clearMatchForm() {

  document.getElementById(
    'editing-match-id'
  ).value = '';


  document.getElementById(
    'match-form-title'
  ).textContent =
    'Добавить матч';


  document.getElementById(
    'opponent'
  ).value = '';


  document.getElementById(
    'match_date'
  ).value = '';


  document.getElementById(
    'competition'
  ).value = '';


  document.getElementById(
    'venue'
  ).value = '';


  document.getElementById(
    'is_home'
  ).value = 'true';


  document.getElementById(
    'status'
  ).value = 'upcoming';


  document.getElementById(
    'caspiy_score'
  ).value = '';


  document.getElementById(
    'opponent_score'
  ).value = '';

}


function editMatch(id) {

  const match =
    matchesCache.find(
      item =>
        Number(item.id) === Number(id)
    );


  if (!match) return;


  document.getElementById(
    'editing-match-id'
  ).value =
    match.id;


  document.getElementById(
    'match-form-title'
  ).textContent =
    'Редактировать матч';


  const team =
    teamsCache.find(
      t =>
        match.opponent === t.name ||
        match.opponent === getTeamFullName(t)
    );


  document.getElementById(
    'opponent'
  ).value =
    team ? String(team.id) : '';


  document.getElementById(
    'match_date'
  ).value =
    toInputDate(match.match_date);


  document.getElementById(
    'competition'
  ).value =
    match.competition || '';


  document.getElementById(
    'venue'
  ).value =
    match.venue || '';


  document.getElementById(
    'is_home'
  ).value =
    String(match.is_home);


  document.getElementById(
    'status'
  ).value =
    match.status || 'upcoming';


  document.getElementById(
    'caspiy_score'
  ).value =
    match.caspiy_score ?? '';


  document.getElementById(
    'opponent_score'
  ).value =
    match.opponent_score ?? '';


  window.scrollTo({
    top: 150,
    behavior: 'smooth'
  });

}


async function setFeatured(id) {

  const { error: clearError } =
    await supabase
      .from('matches')
      .update({
        is_featured: false
      })
      .eq(
        'is_featured',
        true
      );


  if (clearError) {

    showMessage(
      clearError.message,
      'error'
    );

    return;

  }


  const { error } =
    await supabase
      .from('matches')
      .update({
        is_featured: true
      })
      .eq(
        'id',
        id
      );


  if (error) {

    showMessage(
      error.message,
      'error'
    );

    return;

  }


  showMessage(
    'Матч теперь показывается на главной.'
  );


  await loadMatches();

}


async function deleteMatch(id) {

  const ok =
    confirm(
      'Удалить этот матч?'
    );


  if (!ok) return;


  const { error } =
    await supabase
      .from('matches')
      .delete()
      .eq(
        'id',
        id
      );


  if (error) {

    showMessage(
      error.message,
      'error'
    );

    return;

  }


  showMessage(
    'Матч удалён.'
  );


  await loadMatches();

}


document.getElementById(
  'save-match-btn'
).addEventListener(
  'click',
  async () => {

    message.className = '';

    message.textContent = '';


    const teamId =
      Number(
        document.getElementById(
          'opponent'
        ).value
      );


    const team =
      teamsCache.find(
        item =>
          Number(item.id) === teamId
      );


    if (!team) {

      showMessage(
        'Выберите соперника.',
        'error'
      );

      return;

    }


    const matchDate =
      document.getElementById(
        'match_date'
      ).value;


    if (!matchDate) {

      showMessage(
        'Укажите дату матча.',
        'error'
      );

      return;

    }


    const caspiyScoreValue =
      document.getElementById(
        'caspiy_score'
      ).value;


    const opponentScoreValue =
      document.getElementById(
        'opponent_score'
      ).value;


    const matchData = {

      opponent:
        getTeamFullName(team),

      opponent_logo_url:
        team.logo_url || null,

      match_date:
        new Date(matchDate)
          .toISOString(),

      competition:
        document.getElementById(
          'competition'
        ).value.trim(),

      venue:
        document.getElementById(
          'venue'
        ).value.trim(),

      is_home:
        document.getElementById(
          'is_home'
        ).value === 'true',

      status:
        document.getElementById(
          'status'
        ).value,

      caspiy_score:
        caspiyScoreValue === ''
          ? null
          : Number(caspiyScoreValue),

      opponent_score:
        opponentScoreValue === ''
          ? null
          : Number(opponentScoreValue)

    };


    const editingId =
      document.getElementById(
        'editing-match-id'
      ).value;


    let result;


    if (editingId) {

      result =
        await supabase
          .from('matches')
          .update(matchData)
          .eq(
            'id',
            editingId
          );

    } else {

      result =
        await supabase
          .from('matches')
          .insert({
            ...matchData,
            is_featured: false
          });

    }


    if (result.error) {

      showMessage(
        result.error.message,
        'error'
      );

      return;

    }


    showMessage(
      editingId
        ? 'Матч обновлён.'
        : 'Матч добавлен.'
    );


    clearMatchForm();

    await loadMatches();

  }
);


document.getElementById(
  'clear-match-btn'
).addEventListener(
  'click',
  clearMatchForm
);


document.getElementById(
  'matches-list'
).addEventListener(
  'click',
  async event => {

    const button =
      event.target.closest(
        'button[data-action]'
      );


    if (!button) return;


    const id =
      Number(button.dataset.id);


    const action =
      button.dataset.action;


    if (action === 'edit') {

      editMatch(id);

    }


    if (action === 'featured') {

      await setFeatured(id);

    }


    if (action === 'delete') {

      await deleteMatch(id);

    }

  }
);


document.getElementById(
  'add-team-btn'
).addEventListener(
  'click',
  async () => {

    const name =
      document.getElementById(
        'team-name'
      ).value.trim();


    const city =
      document.getElementById(
        'team-city'
      ).value.trim();


    const file =
      document.getElementById(
        'team-logo-file'
      ).files[0];


    if (!name || !file) {

      showTeamMessage(
        'Укажите название и выберите логотип.',
        'error'
      );

      return;

    }


    showTeamMessage(
      'Загрузка...'
    );


    const extension =
      file.name
        .split('.')
        .pop();


    const fileName =
      crypto.randomUUID() +
      '.' +
      extension;


    const { error: uploadError } =
      await supabase.storage
        .from('team-logos')
        .upload(
          fileName,
          file
        );


    if (uploadError) {

      showTeamMessage(
        uploadError.message,
        'error'
      );

      return;

    }


    const { data: urlData } =
      supabase.storage
        .from('team-logos')
        .getPublicUrl(
          fileName
        );


    const { error } =
      await supabase
        .from('teams')
        .insert({
          name,
          city: city || null,
          logo_url:
            urlData.publicUrl,
          is_active: true
        });


    if (error) {

      showTeamMessage(
        error.message,
        'error'
      );

      return;

    }


    showTeamMessage(
      'Команда добавлена.'
    );


    document.getElementById(
      'team-name'
    ).value = '';


    document.getElementById(
      'team-city'
    ).value = '';


    document.getElementById(
      'team-logo-file'
    ).value = '';


    await loadTeams();

  }
);


document.getElementById(
  'login-btn'
).addEventListener(
  'click',
  async () => {

    const email =
      document.getElementById(
        'email'
      ).value.trim();


    const password =
      document.getElementById(
        'password'
      ).value;


    const { data, error } =
      await supabase.auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {

      const loginMessage =
        document.getElementById(
          'login-message'
        );

      loginMessage.textContent =
        error.message;

      loginMessage.className =
        'error';

      return;

    }


    await showAdmin(
      data.session
    );

  }
);


document.getElementById(
  'logout-btn'
).addEventListener(
  'click',
  async () => {

    await supabase.auth.signOut();

    location.reload();

  }
);


document.getElementById(
  'site-btn'
).addEventListener(
  'click',
  () => {

    window.open(
      '../',
      '_blank'
    );

  }
);


async function showAdmin(session) {

  loginPanel.style.display =
    'none';

  adminPanel.style.display =
    'block';


  document.getElementById(
    'admin-email'
  ).textContent =
    session.user.email;


  await loadTeams();

  await loadMatches();

}


const {
  data: { session }
} =
  await supabase.auth
    .getSession();


if (session) {

  await showAdmin(
    session
  );

}

</script>

</body>
</html>
