<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КАСПИЙ — Админ-панель</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 70% 10%, rgba(20, 132, 190, .16), transparent 30%),
        #020b12;
      color: #fff;
      min-height: 100vh;
    }

    .wrap {
      width: min(900px, calc(100% - 32px));
      margin: auto;
      padding: 60px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .brand img {
      width: 76px;
      height: 76px;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 3px;
    }

    .brand span {
      display: block;
      margin-top: 5px;
      color: #58d6ff;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .card {
      background: rgba(5, 22, 34, .94);
      border: 1px solid rgba(70, 205, 255, .28);
      padding: 32px;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .muted {
      color: #879cab;
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #9fc6d8;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      background: #061522;
      color: #fff;
      border: 1px solid #20445a;
      border-radius: 6px;
      padding: 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #42cfff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 14px 22px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #28bdf4;
      color: #02111b;
    }

    .secondary {
      background: #102838;
      color: #d4edf7;
    }

    .danger {
      background: #391b22;
      color: #ffbdc7;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    #admin-panel {
      display: none;
    }

    #message {
      margin-top: 18px;
      padding: 13px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block !important;
      background: rgba(28, 153, 92, .14);
      border: 1px solid rgba(58, 214, 132, .4);
      color: #82efb5;
    }

    .error {
      display: block !important;
      background: rgba(190, 49, 70, .14);
      border: 1px solid rgba(255, 94, 117, .4);
      color: #ff9dab;
    }

    .statusbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .email {
      color: #54d0ff;
      font-size: 13px;
    }
.admin-separator {
  border: 0;
  border-top: 1px solid rgba(255,255,255,.08);
  margin: 40px 0;
}

.teams-admin {
  margin-top: 10px;
}

.teams-list {
  margin-top: 28px;
  display: grid;
  gap: 12px;
}

.team-admin-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px;
  border: 1px solid rgba(70,205,255,.18);
  background: rgba(3,18,29,.7);
  border-radius: 7px;
}

.team-admin-item img {
  width: 58px;
  height: 58px;
  object-fit: contain;
}

.team-admin-item strong {
  display: block;
}

.team-admin-item span {
  color: #8098a8;
  font-size: 12px;
  margin-top: 4px;
  display: block;
}

#team-message {
  margin-top: 18px;
  font-size: 14px;
}
    @media(max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .wrap {
        padding: 30px 0;
      }

      .card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <img src="../logo.png" alt="Каспий">
    <div>
      <h1>КАСПИЙ</h1>
      <span>ADMIN PANEL</span>
    </div>
  </div>

  <div class="card" id="login-panel">
    <h2>Вход администратора</h2>
    <p class="muted">
      Войдите с аккаунтом администратора клуба.
    </p>

    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="admin@example.com">
    </div>

    <div class="field">
      <label>Пароль</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="primary" id="login-btn">Войти</button>

    <div id="login-message"></div>
  </div>


  <div class="card" id="admin-panel">

    <div class="statusbar">
      <div>
        <div class="muted">Вы вошли как</div>
        <div class="email" id="admin-email"></div>
      </div>

      <button class="secondary" id="logout-btn">
        Выйти
      </button>
    </div>

    <h2>Следующий матч</h2>

    <div class="field">
      <label>Соперник</label>
      <input type="text" id="opponent" placeholder="Например: Аят">
    </div>

    <div class="grid">

      <div class="field">
        <label>Дата и время</label>
        <input type="datetime-local" id="match_date">
      </div>

      <div class="field">
        <label>Турнир</label>
        <input type="text" id="competition" placeholder="Чемпионат Казахстана">
      </div>

    </div>

    <div class="field">
      <label>Арена</label>
      <input type="text" id="venue" placeholder="СК Мангистау">
    </div>

    <div class="field">
      <label>URL логотипа соперника</label>
      <input type="url" id="opponent_logo_url" placeholder="https://...">
    </div>

    <div class="grid">

      <div class="field">
        <label>Где играет Каспий</label>
        <select id="is_home">
          <option value="true">Дома</option>
          <option value="false">В гостях</option>
        </select>
      </div>

      <div class="field">
        <label>Статус</label>
        <select id="status">
          <option value="upcoming">Предстоящий</option>
          <option value="finished">Завершён</option>
          <option value="postponed">Перенесён</option>
        </select>
      </div>

    </div>

    <div class="buttons">
      <button class="primary" id="save-btn">
        Сохранить матч
      </button>

      <a href="../" style="text-decoration:none;">
        <button class="secondary" type="button">
          Открыть сайт
        </button>
      </a>
    </div>

    <div id="message"></div>
<hr class="admin-separator">

<section class="teams-admin">

  <h2>Команды</h2>

  <p class="muted">
    Добавление команд и их официальных логотипов.
  </p>

  <div class="grid">

    <div class="field">
      <label>Название команды</label>
      <input
        type="text"
        id="team-name"
        placeholder="Например: Байтерек"
      >
    </div>

    <div class="field">
      <label>Город</label>
      <input
        type="text"
        id="team-city"
        placeholder="Например: Орал"
      >
    </div>

  </div>

  <div class="field">
    <label>Логотип команды</label>

    <input
      type="file"
      id="team-logo-file"
      accept="image/png,image/jpeg,image/webp,image/svg+xml"
    >
  </div>

  <div class="buttons">
    <button
      class="primary"
      id="add-team-btn"
      type="button"
    >
      Добавить команду
    </button>
  </div>

  <div id="team-message"></div>

  <div class="teams-list" id="teams-list">
  </div>

</section>
  </div>

</div>


<script type="module">

  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL =
    'https://socqbqyhkyvxnsukgcqm.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_l_g8YROT8Z2I3JqYHvyGQA_HIAKiqbK';

  const supabase =
    createClient(SUPABASE_URL, SUPABASE_KEY);


  const loginPanel =
    document.getElementById('login-panel');

  const adminPanel =
    document.getElementById('admin-panel');

  const loginMessage =
    document.getElementById('login-message');

  const message =
    document.getElementById('message');

  let currentMatchId = null;


  function showMessage(text, type = 'success') {

    message.textContent = text;
    message.className = type;

  }


  function showLoginMessage(text, type = 'error') {

    loginMessage.textContent = text;
    loginMessage.className = type;

  }


  function toLocalDateTime(value) {

    if (!value) return '';

    const d = new Date(value);

    const pad = n =>
      String(n).padStart(2, '0');

    return (
      d.getFullYear() + '-' +
      pad(d.getMonth() + 1) + '-' +
      pad(d.getDate()) + 'T' +
      pad(d.getHours()) + ':' +
      pad(d.getMinutes())
    );

  }


  async function loadMatch() {

    const { data, error } =
      await supabase
        .from('matches')
        .select('*')
        .eq('is_featured', true)
        .order('match_date', { ascending: true })
        .limit(1)
        .maybeSingle();

    if (error) {
      showMessage(
        'Ошибка загрузки матча: ' + error.message,
        'error'
      );
      return;
    }

    if (!data) {
      currentMatchId = null;
      return;
    }

    currentMatchId = data.id;

    document.getElementById('opponent').value =
      data.opponent || '';

    document.getElementById('match_date').value =
      toLocalDateTime(data.match_date);

    document.getElementById('venue').value =
      data.venue || '';

    document.getElementById('competition').value =
      data.competition || '';

    document.getElementById('opponent_logo_url').value =
      data.opponent_logo_url || '';

    document.getElementById('is_home').value =
      String(data.is_home);

    document.getElementById('status').value =
      data.status || 'upcoming';

  }


  async function showAdmin(session) {

    loginPanel.style.display = 'none';
    adminPanel.style.display = 'block';

    document.getElementById('admin-email').textContent =
      session.user.email;

    await loadMatch();
    await loadTeams();

  }


  document.getElementById('login-btn')
    .addEventListener('click', async () => {

      loginMessage.style.display = 'none';

      const email =
        document.getElementById('email').value.trim();

      const password =
        document.getElementById('password').value;

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {

        showLoginMessage(
          'Ошибка входа: ' + error.message
        );

        return;

      }

      await showAdmin(data.session);

    });


  document.getElementById('logout-btn')
    .addEventListener('click', async () => {

      await supabase.auth.signOut();

      adminPanel.style.display = 'none';
      loginPanel.style.display = 'block';

    });


  document.getElementById('save-btn')
    .addEventListener('click', async () => {

      message.style.display = 'none';

      const opponent =
        document.getElementById('opponent').value.trim();

      const matchDate =
        document.getElementById('match_date').value;

      const venue =
        document.getElementById('venue').value.trim();

      const competition =
        document.getElementById('competition').value.trim();

      const logo =
        document.getElementById('opponent_logo_url').value.trim();

      const isHome =
        document.getElementById('is_home').value === 'true';

      const status =
        document.getElementById('status').value;


      if (!opponent || !matchDate) {

        showMessage(
          'Укажите соперника, дату и время.',
          'error'
        );

        return;

      }


      const matchData = {

        opponent: opponent,

        match_date:
          new Date(matchDate).toISOString(),

        venue: venue,

        competition: competition,

        opponent_logo_url:
          logo || null,

        is_home: isHome,

        status: status,

        is_featured: true

      };


      let result;


      if (currentMatchId) {

        result =
          await supabase
            .from('matches')
            .update(matchData)
            .eq('id', currentMatchId)
            .select()
            .single();

      } else {

        result =
          await supabase
            .from('matches')
            .insert(matchData)
            .select()
            .single();

      }


      if (result.error) {

        showMessage(
          'Ошибка сохранения: ' +
          result.error.message,
          'error'
        );

        return;

      }


      currentMatchId =
        result.data.id;

      showMessage(
        'Матч успешно сохранён.'
      );

  });

async function loadTeams() {

  const list = document.getElementById('teams-list');

  const { data, error } = await supabase
    .from('teams')
    .select('*')
    .eq('is_active', true)
    .order('name');

  if (error) {
    console.error('Ошибка загрузки команд:', error);
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML =
      '<div class="muted">Команды пока не добавлены.</div>';
    return;
  }

  list.innerHTML = data.map(team => `
    <div class="team-admin-item">
      ${
        team.logo_url
          ? `<img src="${team.logo_url}" alt="${team.name}">`
          : `<div style="
              width:58px;
              height:58px;
              border:1px solid #27546c;
              border-radius:50%;
              display:grid;
              place-items:center;
              color:#58d6ff;
            ">?</div>`
      }

      <div>
        <strong>${team.name}</strong>
        <span>${team.city || ''}</span>
      </div>
    </div>
  `).join('');
}


document.getElementById('add-team-btn')
  .addEventListener('click', async () => {

    const teamMessage =
      document.getElementById('team-message');

    teamMessage.className = '';
    teamMessage.textContent = '';

    const name =
      document.getElementById('team-name').value.trim();

    const city =
      document.getElementById('team-city').value.trim();

    const file =
      document.getElementById('team-logo-file').files[0];

    if (!name) {
      teamMessage.textContent =
        'Укажите название команды.';
      teamMessage.className = 'error';
      return;
    }

    if (!file) {
      teamMessage.textContent =
        'Выберите логотип команды.';
      teamMessage.className = 'error';
      return;
    }


    const extension =
      file.name.split('.').pop().toLowerCase();

    const fileName =
      `${crypto.randomUUID()}.${extension}`;


    // Загружаем картинку в Storage
    const { error: uploadError } =
      await supabase.storage
        .from('team-logos')
        .upload(fileName, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type
        });

    if (uploadError) {
      teamMessage.textContent =
        'Ошибка загрузки логотипа: ' +
        uploadError.message;
      teamMessage.className = 'error';
      return;
    }


    // Получаем публичный URL
    const { data: urlData } =
      supabase.storage
        .from('team-logos')
        .getPublicUrl(fileName);

    const logoUrl =
      urlData.publicUrl;


    // Сохраняем команду
    const { error: insertError } =
      await supabase
        .from('teams')
        .insert({
          name: name,
          city: city || null,
          logo_url: logoUrl,
          is_active: true
        });

    if (insertError) {
      teamMessage.textContent =
        'Ошибка сохранения команды: ' +
        insertError.message;
      teamMessage.className = 'error';
      return;
    }


    teamMessage.textContent =
      'Команда успешно добавлена.';
    teamMessage.className = 'success';


    document.getElementById('team-name').value = '';
    document.getElementById('team-city').value = '';
    document.getElementById('team-logo-file').value = '';

    await loadTeams();

  });
  const {
    data: { session }
  } =
    await supabase.auth.getSession();


  if (session) {

    await showAdmin(session);

  }

</script>

</body>
</html>
