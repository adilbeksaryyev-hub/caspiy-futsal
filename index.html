<script type="module">

  import { createClient }
  from
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


  const supabase =
    createClient(
      'https://socqbqyhkyvxnsukgcqm.supabase.co',
      'sb_publishable_l_g8YROT8Z2I3JqYHvyGQA_HIAKiqbK'
    );


  let countdownTimer =
    null;


  /* =====================================================
     MOBILE MENU
     ===================================================== */

  const mobileMenu =
    document.getElementById(
      'mobileMenu'
    );


  const mobileMenuButton =
    document.getElementById(
      'mobileMenuButton'
    );


  function openMobileMenu() {

    mobileMenu.classList.add(
      'open'
    );


    mobileMenuButton.classList.add(
      'active'
    );


    mobileMenuButton.setAttribute(
      'aria-expanded',
      'true'
    );


    document.body.classList.add(
      'menu-open'
    );

  }


  function closeMobileMenu() {

    mobileMenu.classList.remove(
      'open'
    );


    mobileMenuButton.classList.remove(
      'active'
    );


    mobileMenuButton.setAttribute(
      'aria-expanded',
      'false'
    );


    document.body.classList.remove(
      'menu-open'
    );

  }


  mobileMenuButton
    .addEventListener(
      'click',
      () => {

        if (
          mobileMenu.classList.contains(
            'open'
          )
        ) {

          closeMobileMenu();

        } else {

          openMobileMenu();

        }

      }
    );


  mobileMenu
    .querySelectorAll('a')
    .forEach(
      link => {

        link.addEventListener(
          'click',
          closeMobileMenu
        );

      }
    );


  document
    .addEventListener(
      'keydown',
      event => {

        if (
          event.key === 'Escape'
        ) {

          closeMobileMenu();

        }

      }
    );


  window
    .addEventListener(
      'resize',
      () => {

        if (
          window.innerWidth > 900
        ) {

          closeMobileMenu();

        }

      }
    );


  /* =====================================================
     HELPERS
     ===================================================== */

  function escapeHtml(value) {

    return String(value ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");

  }


  function pad(value) {

    return String(value)
      .padStart(
        2,
        '0'
      );

  }


  function formatMatchDate(value) {

    if (!value) {
      return '';
    }


    return new Intl.DateTimeFormat(
      'kk-KZ',
      {
        timeZone:'Asia/Aqtau',
        day:'numeric',
        month:'long',
        year:'numeric'
      }
    )
    .format(
      new Date(value)
    )
    .toUpperCase();

  }


  function formatMatchTime(value) {

    if (!value) {
      return '--:--';
    }


    return new Intl.DateTimeFormat(
      'kk-KZ',
      {
        timeZone:'Asia/Aqtau',
        hour:'2-digit',
        minute:'2-digit',
        hour12:false
      }
    )
    .format(
      new Date(value)
    );

  }


  function formatShortDate(value) {

    if (!value) {
      return '';
    }


    return new Intl.DateTimeFormat(
      'kk-KZ',
      {
        timeZone:'Asia/Aqtau',
        day:'2-digit',
        month:'2-digit',
        year:'numeric'
      }
    )
    .format(
      new Date(value)
    );

  }


  function formatNewsDate(value) {

    if (!value) {
      return '';
    }


    return new Intl.DateTimeFormat(
      'kk-KZ',
      {
        timeZone:'Asia/Aqtau',
        day:'numeric',
        month:'long',
        year:'numeric'
      }
    )
    .format(
      new Date(value)
    )
    .toUpperCase();

  }


  /* =====================================================
     SETTINGS
     ===================================================== */

  async function loadSettings() {

    const {
      data,
      error
    } =
      await supabase
        .from('site_settings')
        .select(
          'ticket_url,address'
        )
        .eq(
          'id',
          1
        )
        .maybeSingle();


    if (
      error ||
      !data
    ) {
      return;
    }


    const ticketButton =
      document.getElementById(
        'ticketButton'
      );


    const mobileTicketButton =
      document.getElementById(
        'mobileTicketButton'
      );


    if (data.ticket_url) {

      ticketButton.href =
        data.ticket_url;


      mobileTicketButton.href =
        data.ticket_url;


      ticketButton.classList.remove(
        'disabled'
      );


      mobileTicketButton.classList.remove(
        'disabled'
      );

    } else {

      ticketButton.href =
        '#';


      mobileTicketButton.href =
        '#';


      ticketButton.classList.add(
        'disabled'
      );


      mobileTicketButton.classList.add(
        'disabled'
      );

    }


    if (data.address) {

      const address =
        data.address.toUpperCase();


      document
        .getElementById(
          'footerAddress'
        )
        .textContent =
          address;


      document
        .getElementById(
          'mobileAddress'
        )
        .textContent =
          address;

    }

  }


  /* =====================================================
     PLAYERS
     ===================================================== */

  async function loadPlayers() {

    const list =
      document.getElementById(
        'players-list'
      );


    const {
      data,
      error
    } =
      await supabase
        .from('players')
        .select(
          'id,name,number,position,photo_url,sort_order'
        )
        .eq(
          'is_active',
          true
        )
        .order(
          'sort_order',
          {
            ascending:true
          }
        )
        .order(
          'number',
          {
            ascending:true
          }
        )
        .limit(5);


    if (
      error ||
      !data?.length
    ) {

      list.innerHTML = `
        <div class="players-empty">
          ОЙЫНШЫЛАР ӘЗІРГЕ ҚОСЫЛМАҒАН
        </div>
      `;

      return;

    }


    list.innerHTML =
      data
        .map(
          player => `

            <article class="player-card">

              ${
                player.photo_url
                  ? `
                    <img
                      class="player-photo"
                      src="${escapeHtml(player.photo_url)}"
                      alt="${escapeHtml(player.name)}"
                      loading="lazy"
                    >
                  `
                  : ''
              }

              <div class="player-overlay"></div>

              <div class="player-number">
                ${player.number ?? ''}
              </div>

              <div class="player-info">

                <div class="player-name">
                  ${escapeHtml(player.name)}
                </div>

                <div class="player-position">
                  ${escapeHtml(player.position || '')}
                </div>

              </div>

            </article>

          `
        )
        .join('');

  }


  /* =====================================================
     NEWS
     ===================================================== */

  async function loadNews() {

    const list =
      document.getElementById(
        'news-list'
      );


    const {
      data,
      error
    } =
      await supabase
        .from('news')
        .select(
          'id,title,description,image_url,published_at,sort_order'
        )
        .eq(
          'is_active',
          true
        )
        .order(
          'sort_order',
          {
            ascending:true
          }
        )
        .order(
          'published_at',
          {
            ascending:false
          }
        )
        .limit(4);


    if (
      error ||
      !data?.length
    ) {

      list.innerHTML = `
        <div class="news-empty">
          ЖАҢАЛЫҚТАР ӘЗІРГЕ ҚОСЫЛМАҒАН
        </div>
      `;

      return;

    }


    list.innerHTML =
      data
        .map(
          item => `

            <a
              class="news-card"
              href="news-detail.html?id=${item.id}"
            >

              <div class="news-image">

                ${
                  item.image_url
                    ? `
                      <img
                        src="${escapeHtml(item.image_url)}"
                        alt="${escapeHtml(item.title)}"
                        loading="lazy"
                      >
                    `
                    : `
                      <img
                        class="news-no-image"
                        src="logo.png"
                        alt=""
                      >
                    `
                }

                <div class="news-date">
                  ${formatNewsDate(item.published_at)}
                </div>

              </div>


              <div class="news-content">

                <div class="news-title">
                  ${escapeHtml(item.title)}
                </div>


                ${
                  item.description
                    ? `
                      <div class="news-description">
                        ${escapeHtml(item.description)}
                      </div>
                    `
                    : ''
                }


                <div class="news-bottom">

                  <span class="news-read-more">
                    ТОЛЫҒЫРАҚ
                  </span>

                  <span class="news-arrow">
                    →
                  </span>

                </div>

              </div>

            </a>

          `
        )
        .join('');

  }


  /* =====================================================
     COUNTDOWN
     ===================================================== */

  function startCountdown(
    matchDate
  ) {

    if (countdownTimer) {

      clearInterval(
        countdownTimer
      );

    }


    function update() {

      let difference =
        new Date(
          matchDate
        ).getTime() -
        Date.now();


      if (
        difference <= 0
      ) {

        document
          .getElementById(
            'countdown-days'
          )
          .textContent =
            '00';


        document
          .getElementById(
            'countdown-hours'
          )
          .textContent =
            '00';


        document
          .getElementById(
            'countdown-minutes'
          )
          .textContent =
            '00';


        document
          .getElementById(
            'countdown-title'
          )
          .textContent =
            'МАТЧ БАСТАЛДЫ';


        return;

      }


      const day =
        1000 * 60 * 60 * 24;


      const hour =
        1000 * 60 * 60;


      const minute =
        1000 * 60;


      const days =
        Math.floor(
          difference / day
        );


      difference %=
        day;


      const hours =
        Math.floor(
          difference / hour
        );


      difference %=
        hour;


      const minutes =
        Math.floor(
          difference / minute
        );


      document
        .getElementById(
          'countdown-days'
        )
        .textContent =
          pad(days);


      document
        .getElementById(
          'countdown-hours'
        )
        .textContent =
          pad(hours);


      document
        .getElementById(
          'countdown-minutes'
        )
        .textContent =
          pad(minutes);

    }


    update();


    countdownTimer =
      setInterval(
        update,
        30000
      );

  }


  /* =====================================================
     NEXT MATCH
     ===================================================== */

  async function loadNextMatch() {

    const [
      matchResponse,
      teamsResponse
    ] =
      await Promise.all([

        supabase
          .from('matches')
          .select('*')
          .eq(
            'is_featured',
            true
          )
          .eq(
            'status',
            'upcoming'
          )
          .order(
            'match_date',
            {
              ascending:true
            }
          )
          .limit(1)
          .maybeSingle(),

        supabase
          .from('teams')
          .select(
            'name,city,logo_url'
          )
          .eq(
            'is_active',
            true
          )

      ]);


    const match =
      matchResponse.data;


    if (!match) {

      document
        .getElementById(
          'next-match-date'
        )
        .textContent =
          'МАТЧ ӘЗІРГЕ БЕЛГІЛЕНБЕДІ';


      document
        .getElementById(
          'countdown-title'
        )
        .textContent =
          'КЕЛЕСІ МАТЧ';


      return;

    }


    const teams =
      teamsResponse.data || [];


    const opponentTeam =
      teams.find(
        team =>
          String(
            match.opponent || ''
          )
          .toLowerCase()
          .includes(
            String(
              team.name || ''
            )
            .toLowerCase()
          )
      );


    const caspiy = {

      name:
        'КАСПИЙ',

      city:
        'АҚТАУ',

      logo:
        'logo.png'

    };


    const opponent = {

      name:
        String(
          opponentTeam?.name ||
          match.opponent ||
          'ҚАРСЫЛАС'
        )
        .toUpperCase(),

      city:
        String(
          opponentTeam?.city ||
          ''
        )
        .toUpperCase(),

      logo:
        opponentTeam?.logo_url ||
        match.opponent_logo_url ||
        'logo.png'

    };


    function renderTeam(
      side,
      team
    ) {

      document
        .getElementById(
          `${side}-team-logo`
        )
        .src =
          team.logo;


      document
        .getElementById(
          `${side}-team-name`
        )
        .textContent =
          team.name;


      document
        .getElementById(
          `${side}-team-city`
        )
        .textContent =
          team.city;

    }


    if (
      match.is_home !== false
    ) {

      renderTeam(
        'left',
        caspiy
      );


      renderTeam(
        'right',
        opponent
      );

    } else {

      renderTeam(
        'left',
        opponent
      );


      renderTeam(
        'right',
        caspiy
      );

    }


    document
      .getElementById(
        'next-match-date'
      )
      .textContent =
        formatMatchDate(
          match.match_date
        );


    document
      .getElementById(
        'next-match-time'
      )
      .textContent =
        formatMatchTime(
          match.match_date
        );


    document
      .getElementById(
        'next-match-competition'
      )
      .textContent =
        match.competition ||
        '';


    document
      .getElementById(
        'next-match-venue'
      )
      .textContent =
        match.venue ||
        '';


    startCountdown(
      match.match_date
    );

  }


  /* =====================================================
     RESULTS
     ===================================================== */

  async function loadResults() {

    const list =
      document.getElementById(
        'results-list'
      );


    const {
      data,
      error
    } =
      await supabase
        .from('matches')
        .select('*')
        .eq(
          'status',
          'finished'
        )
        .order(
          'match_date',
          {
            ascending:false
          }
        )
        .limit(4);


    if (
      error ||
      !data?.length
    ) {

      list.innerHTML = `
        <div class="results-empty">
          АЯҚТАЛҒАН МАТЧТАР ӘЗІРГЕ ЖОҚ
        </div>
      `;

      return;

    }


    list.innerHTML =
      data
        .map(
          match => {

            const cs =
              match.caspiy_score ??
              '-';


            const os =
              match.opponent_score ??
              '-';


            const caspiyTeam = `

              <div class="result-team">

                <div class="result-logo">

                  <img
                    src="logo.png"
                    alt=""
                  >

                </div>

                <div>

                  <div class="result-team-name">
                    КАСПИЙ
                  </div>

                  <div class="result-city">
                    АҚТАУ
                  </div>

                </div>

              </div>

            `;


            const opponentTeam = `

              <div class="result-team away">

                <div class="result-logo">

                  ${
                    match.opponent_logo_url
                      ? `
                        <img
                          src="${escapeHtml(match.opponent_logo_url)}"
                          alt=""
                        >
                      `
                      : ''
                  }

                </div>

                <div class="result-team-name">
                  ${escapeHtml(match.opponent || '')}
                </div>

              </div>

            `;


            return `

              <article class="result-card">

                <div class="result-top">

                  <div class="result-competition">
                    ${escapeHtml(match.competition || 'МАТЧ')}
                  </div>

                  <div class="result-date">
                    ${formatShortDate(match.match_date)}
                  </div>

                </div>


                <div class="result-teams">

                  ${
                    match.is_home !== false
                      ? caspiyTeam
                      : opponentTeam.replace(
                          'result-team away',
                          'result-team'
                        )
                  }


                  <div class="result-score">

                    ${
                      match.is_home !== false
                        ? `${cs}:${os}`
                        : `${os}:${cs}`
                    }

                  </div>


                  ${
                    match.is_home !== false
                      ? opponentTeam
                      : caspiyTeam.replace(
                          'result-team"',
                          'result-team away"'
                        )
                  }

                </div>


                <div class="result-venue">
                  ${escapeHtml(match.venue || '')}
                </div>

              </article>

            `;

          }
        )
        .join('');

  }


  /* =====================================================
     START
     ===================================================== */

  await Promise.all([
    loadSettings(),
    loadNextMatch(),
    loadPlayers(),
    loadNews(),
    loadResults()
  ]);

</script>
